<header class="site-header">
  <div class="container">
    <a class="brand" href="{{ '/' | relative_url }}">
      MEHRAN<span class="brand__cursor" aria-hidden="true"></span>
    </a>

    <nav aria-label="Primary">
      <ul class="nav-list" id="nav-list">
        {% for item in site.data.nav %}
        <li><a href="{{ item.anchor }}">{{ item.label }}</a></li>
        {% endfor %}
      </ul>
    </nav>

    <button class="nav-toggle" id="nav-toggle" aria-expanded="false" aria-controls="nav-list" aria-label="Toggle navigation menu">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
        <path d="M2 4.5h14M2 9h14M2 13.5h14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </button>
  </div>
</header>
