<head>

    <meta property="og:description" content="Detection rules, network investigations, and SOC lab write-ups.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://mehran-sec.github.io/writeups.html">
    <meta name="theme-color" content="#0B0B0F">
    <link rel="canonical" href="https://mehran-sec.github.io/writeups.html">

    <!-- Favicon: shield emoji, no file needed -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛡️</text></svg>">

    <!-- Markdown Parser (marked.js) -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
    /* ==========================================================================
       VARIABLES — Edit these to change the entire look
       ========================================================================== */
    :root {
        --bg-primary: #0B0B0F;
        --bg-surface: #14141A;
        --bg-elevated: #1C1C24;
        --text-primary: #EDEDEB;
        --text-secondary: #9B9B9B;
        --text-muted: #7C7C7C;
        --accent: #A8C66C;
        --accent-hover: #BDDA84;
        --border: #252530;
        --danger: #E55B5B;
        --radius: 4px;
        --max-width: 1080px;
        --nav-height: 60px;
        /* System fonts — zero external requests, instant load */
        --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        --font-mono: ui-monospace, 'Cascadia Code', 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
    }

    /* ==========================================================================
       RESET
       ========================================================================== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    img { max-width: 100%; display: block; }
    ul, ol { list-style: none; }
    a { color: inherit; text-decoration: none; }
    button, input, textarea { font: inherit; color: inherit; border: none; background: none; }

    /* ==========================================================================
       BASE
       ========================================================================== */
    html { font-size: 16px; }
    @media (prefers-reduced-motion: no-preference) {
        html { scroll-behavior: smooth; }
    }

    body {
        font-family: var(--font-sans);
        background-color: var(--bg-primary);
        color: var(--text-secondary);
        line-height: 1.7;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
    }

    ::selection {
        background-color: rgba(168, 198, 108, 0.2);
        color: var(--text-primary);
    }

    h1, h2, h3, h4 {
        font-family: var(--font-sans);
        color: var(--text-primary);
        font-weight: 600;
        line-height: 1.2;
    }

    /* ==========================================================================
       ACCESSIBILITY
       ========================================================================== */
    .skip-link {
        position: absolute;
        top: -100%;
        left: 1rem;
        background: var(--accent);
        color: var(--bg-primary);
        padding: 0.5rem 1rem;
        border-radius: var(--radius);
        font-size: 0.875rem;
        font-weight: 600;
        z-index: 1000;
    }
    .skip-link:focus {
        top: 0.5rem;
    }

    :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
    }

    @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
            transition-duration: 0.01ms !important;
            animation-duration: 0.01ms !important;
        }
    }

    /* ==========================================================================
       LAYOUT
       ========================================================================== */
    .container {
        max-width: var(--max-width);
        margin: 0 auto;
        padding: 0 1.25rem;
    }

    .section {
        padding: 4rem 0;
        scroll-margin-top: calc(var(--nav-height) + 1.5rem);
    }

    .section-title {
        font-size: 1.375rem;
        margin-bottom: 2rem;
        color: var(--text-primary);
    }

    /* ==========================================================================
       NAVIGATION
       ========================================================================== */
    .nav {
        position: sticky;
        top: 0;
        z-index: 100;
        background: rgba(11, 11, 15, 0.88);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--border);
        height: var(--nav-height);
        display: flex;
        align-items: center;
    }
    .nav-inner {
        max-width: var(--max-width);
        margin: 0 auto;
        padding: 0 1.25rem;
        width: 100%;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    .nav-logo {
        font-size: 0.875rem;
        font-weight: 600;
        color: var(--text-primary);
        letter-spacing: 0.04em;
    }
    .nav-links {
        display: flex;
        gap: 1.75rem;
    }
    .nav-links a {
        font-size: 0.875rem;
        font-weight: 500;
        color: var(--text-muted);
        transition: color 0.15s ease;
    }
    .nav-links a:hover,
    .nav-links a.active {
        color: var(--accent);
    }

    /* Tags */
    .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 0.375rem;
        margin-bottom: 1rem;
    }
    .tag {
        font-family: var(--font-mono);
        font-size: 0.6875rem;
        color: var(--text-muted);
        background: var(--bg-primary);
        border: 1px solid var(--border);
        padding: 0.25rem 0.5rem;
        border-radius: var(--radius);
    }

    /* ==========================================================================
       FOOTER
       ========================================================================== */
    .footer {
        margin-top: auto;
        border-top: 1px solid var(--border);
        padding: 1.5rem 0;
    }
    .footer-inner {
        max-width: var(--max-width);
        margin: 0 auto;
        padding: 0 1.25rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 0.75rem;
        font-size: 0.8125rem;
        color: var(--text-muted);
    }
    .footer-links {
        display: flex;
        gap: 1.25rem;
    }
    .footer-links a {
        transition: color 0.15s ease;
    }
    .footer-links a:hover {
        color: var(--accent);
    }

    /* ==========================================================================
       NAV — extras for small screens
       ========================================================================== */
    .nav-links a[aria-current="page"] {
        color: var(--accent);
    }
    @media (max-width: 480px) {
        .nav-inner { gap: 0.75rem; }
        .nav-logo { font-size: 0.8125rem; white-space: nowrap; }
        .nav-links { gap: 0.875rem; }
        .nav-links a { font-size: 0.8125rem; white-space: nowrap; }
    }
    @media (max-width: 360px) {
        .nav-logo { display: none; }
        .nav-inner { justify-content: center; }
    }

    /* ==========================================================================
       WRITE-UPS — page header + card grid
       ========================================================================== */
    main.container {
        width: 100%;
    }
    .page-header {
        padding: 4rem 0 0.5rem;
    }
    .page-title {
        font-size: 2.25rem;
        letter-spacing: -0.025em;
        margin-bottom: 0.75rem;
    }
    .page-intro {
        max-width: 52ch;
        font-size: 1.0625rem;
    }

    .card-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr));
        gap: 1.5rem;
        padding: 2rem 0 4rem;
    }
    .card-grid > li {
        display: flex;
    }
    .writeup-card {
        display: flex;
        flex-direction: column;
        flex: 1;
        background: var(--bg-surface);
        border: 1px solid var(--border);
        border-top: 2px solid var(--border);
        border-radius: var(--radius);
        padding: 1.5rem;
        transition: border-color 0.15s ease, background-color 0.15s ease;
    }
    .writeup-card:hover {
        border-top-color: var(--accent);
        background: var(--bg-elevated);
    }
    .writeup-card-meta {
        display: flex;
        justify-content: space-between;
        gap: 1rem;
        margin-bottom: 0.75rem;
        font-family: var(--font-mono);
        font-size: 0.75rem;
        color: var(--text-muted);
    }
    .writeup-card-category {
        color: var(--accent);
    }
    .writeup-card-title {
        font-size: 1.0625rem;
        margin-bottom: 0.5rem;
        transition: color 0.15s ease;
    }
    .writeup-card:hover .writeup-card-title {
        color: var(--accent);
    }
    .writeup-card-summary {
        font-size: 0.9375rem;
        line-height: 1.7;
        margin-bottom: 1rem;
    }
    .writeup-card .tags {
        margin-bottom: 1.25rem;
    }
    .writeup-card-cta {
        margin-top: auto;
        font-family: var(--font-mono);
        font-size: 0.8125rem;
        font-weight: 500;
        color: var(--accent);
    }

    /* ==========================================================================
       ARTICLE VIEW TOGGLE
       ========================================================================== */
    .view-article #page-header,
    .view-article #card-grid {
        display: none !important;
    }
    #article-view {
        display: none;
        padding: 2.5rem 0 4rem;
    }
    .view-article #article-view {
        display: block !important;
    }

    .loading-indicator {
        padding: 3rem 0;
        font-family: var(--font-mono);
        font-size: 0.875rem;
        color: var(--text-muted);
    }

    /* ==========================================================================
       WRITE-UP ARTICLE STYLES
       ========================================================================== */
    .back-link {
        display: inline-block;
        font-family: var(--font-mono);
        font-size: 0.8125rem;
        color: var(--text-muted);
        transition: color 0.15s ease;
        cursor: pointer;
    }
    .back-link:hover {
        color: var(--accent);
    }
    .writeup-header {
        max-width: 72ch;
        margin: 2rem 0 2.5rem;
        padding-bottom: 1.5rem;
        border-bottom: 1px solid var(--border);
    }
    .writeup-header h1 {
        font-size: 2rem;
        letter-spacing: -0.025em;
        margin-bottom: 0.75rem;
    }
    .writeup-meta {
        font-family: var(--font-mono);
        font-size: 0.8125rem;
        color: var(--text-muted);
        margin-bottom: 1rem;
    }
    .writeup-summary {
        font-size: 1.0625rem;
        margin-bottom: 1rem;
    }
    .writeup-header .tags {
        margin-bottom: 0;
    }
    .writeup-footer {
        max-width: 72ch;
        margin-top: 3rem;
        padding-top: 1.5rem;
        border-top: 1px solid var(--border);
    }
    @media (min-width: 768px) {
        .page-title { font-size: 2.75rem; }
        .writeup-header h1 { font-size: 2.5rem; }
    }

    /* Article body — markdown output */
    .writeup-body {
        max-width: 72ch;
    }
    .writeup-body > * + * {
        margin-top: 1.25rem;
    }
    .writeup-body h2 {
        font-size: 1.375rem;
        margin-top: 3rem;
    }
    .writeup-body h3 {
        font-size: 1.125rem;
        margin-top: 2rem;
    }
    .writeup-body strong {
        color: var(--text-primary);
        font-weight: 600;
    }
    .writeup-body a {
        color: var(--accent);
        text-decoration: underline;
        text-underline-offset: 0.2em;
    }
    .writeup-body a:hover {
        color: var(--accent-hover);
    }
    .writeup-body ul,
    .writeup-body ol {
        padding-left: 1.5rem;
    }
    .writeup-body ul { list-style: disc; }
    .writeup-body ol { list-style: decimal; }
    .writeup-body li + li {
        margin-top: 0.375rem;
    }
    .writeup-body li::marker {
        color: var(--text-muted);
    }
    .writeup-body blockquote {
        border-left: 3px solid var(--accent);
        padding: 0.25rem 0 0.25rem 1rem;
        color: var(--text-muted);
    }
    .writeup-body img {
        height: auto;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        margin: 1.5rem 0;
    }
    .writeup-body code {
        font-family: var(--font-mono);
        font-size: 0.875em;
        color: var(--text-primary);
        background: var(--bg-elevated);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 0.1em 0.35em;
    }
    .writeup-body pre {
        font-family: var(--font-mono);
        font-size: 0.8125rem;
        line-height: 1.6;
        background: var(--bg-surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 1rem 1.25rem;
        overflow-x: auto;
    }
    .writeup-body pre code {
        font-size: inherit;
        background: none;
        border: 0;
        padding: 0;
    }
    .writeup-body table {
        display: block;
        max-width: 100%;
        overflow-x: auto;
        border-collapse: collapse;
        font-size: 0.9375rem;
        margin: 1.5rem 0;
    }
    .writeup-body th,
    .writeup-body td {
        text-align: left;
        padding: 0.5rem 0.75rem;
        border-bottom: 1px solid var(--border);
    }
    .writeup-body th {
        color: var(--text-primary);
        font-weight: 600;
        white-space: nowrap;
    }
    </style>
</head>

<body>
    <a href="#main" class="skip-link">Skip to content</a>

    <!-- =====================================================================
         NAVIGATION
         ===================================================================== -->
    <header class="nav" role="banner">
        <div class="nav-inner">
            <a href="index.html" class="nav-logo">Mehran Khan</a>
            <nav class="nav-links" aria-label="Main navigation">
                <a href="index.html#about">About</a>
                <a href="index.html#work">Work</a>
                <a href="writeups.html" aria-current="page">Write-ups</a>
                <a href="index.html#contact">Contact</a>
            </nav>
        </div>
    </header>

    <main id="main" class="container">

        <!-- =================================================================
             PAGE HEADER (Cards list view)
             ================================================================= -->
        <section class="page-header" id="page-header" aria-label="Write-ups">
            <h1 class="page-title">Write-ups</h1>
            <p class="page-intro">
                Detection rules, investigations, and lab walkthroughs.
                Select a card to read the full write-up.
            </p>
        </section>

        <!-- =================================================================
             CARDS GRID (Populated dynamically from writeups/manifest.json)
             ================================================================= -->
        <ul class="card-grid" id="card-grid" role="list">
            <li class="loading-indicator">Loading write-ups&hellip;</li>
        </ul>

        <!-- =================================================================
             ARTICLE VIEW CONTAINER (Rendered dynamically from Markdown)
             ================================================================= -->
        <article id="article-view" aria-live="polite">
            <!-- Content injected here via JavaScript -->
        </article>

    </main>

    <!-- =====================================================================
         FOOTER
         ===================================================================== -->
    <footer class="footer">
        <div class="footer-inner">
            <span>&copy; 2026 Mehran Khan</span>
            <div class="footer-links">
                <a href="https://github.com/mehran-sec"
                   target="_blank" rel="noopener noreferrer">GitHub</a>
                <a href="https://www.linkedin.com/in/mehran-khan-13171a3b6/"
                   target="_blank" rel="noopener noreferrer">LinkedIn</a>
            </div>
        </div>
    </footer>

    <!-- =====================================================================
         AUTOMATIC MARKDOWN LOADER & RENDERER
         ===================================================================== -->
    <script>
    (function() {
        'use strict';

        var DEFAULT_MANIFEST = [
            'ssh-bruteforce-detection.md',
            'pcap-phishing-investigation.md'
        ];

        var postsCache = {};
        var cardGrid = document.getElementById('card-grid');
        var articleView = document.getElementById('article-view');

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>"']/g, function(m) {
                return {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#39;'
                }[m];
            });
        }

        function parseFrontmatter(rawText) {
            var match = rawText.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n([\s\S]*)$/);
            if (!match) {
                return { meta: {}, content: rawText };
            }
            var rawMeta = match[1];
            var content = match[2];
            var meta = {};
            rawMeta.split(/\r?\n/).forEach(function(line) {
                var colonIndex = line.indexOf(':');
                if (colonIndex !== -1) {
                    var key = line.slice(0, colonIndex).trim().toLowerCase();
                    var value = line.slice(colonIndex + 1).trim();
                    meta[key] = value;
                }
            });
            return { meta: meta, content: content };
        }

        function loadPosts() {
            fetch('writeups/manifest.json')
                .then(function(res) {
                    if (res.ok) return res.json();
                    throw new Error('Manifest fetch failed');
                })
                .catch(function() {
                    return DEFAULT_MANIFEST;
                })
                .then(function(files) {
                    var fetchPromises = files.map(function(file) {
                        var slug = file.replace(/\.md$/, '');
                        return fetch('writeups/' + file)
                            .then(function(res) {
                                if (res.ok) return res.text();
                                throw new Error('Failed to load ' + file);
                            })
                            .then(function(text) {
                                var parsed = parseFrontmatter(text);
                                return {
                                    file: file,
                                    slug: slug,
                                    meta: parsed.meta,
                                    content: parsed.content
                                };
                            })
                            .catch(function(err) {
                                console.warn('Could not load writeup:', file, err);
                                return null;
                            });
                    });

                    return Promise.all(fetchPromises);
                })
                .then(function(posts) {
                    cardGrid.innerHTML = '';
                    postsCache = {};

                    posts.filter(Boolean).forEach(function(post) {
                        postsCache[post.slug] = post;

                        var li = document.createElement('li');
                        var tags = (post.meta.tags || '').split(',').map(function(t) { return t.trim(); }).filter(Boolean);
                        var tagsHtml = tags.map(function(t) {
                            return '<span class="tag">' + escapeHtml(t) + '</span>';
                        }).join('');

                        li.innerHTML =
                            '<a class="writeup-card" href="#' + encodeURIComponent(post.slug) + '">' +
                                '<span class="writeup-card-meta">' +
                                    '<span class="writeup-card-category">' + escapeHtml(post.meta.category || 'Analysis') + '</span>' +
                                    '<time>' + escapeHtml(post.meta.date || '') + '</time>' +
                                '</span>' +
                                '<h2 class="writeup-card-title">' + escapeHtml(post.meta.title || post.slug) + '</h2>' +
                                '<span class="writeup-card-summary">' +
                                    escapeHtml(post.meta.summary || '') +
                                '</span>' +
                                (tagsHtml ? '<div class="tags">' + tagsHtml + '</div>' : '') +
                                '<span class="writeup-card-cta">Read write-up &rarr;</span>' +
                            '</a>';

                        cardGrid.appendChild(li);
                    });

                    handleRoute();
                });
        }

        function renderArticle(post) {
            var tags = (post.meta.tags || '').split(',').map(function(t) { return t.trim(); }).filter(Boolean);
            var tagsHtml = tags.map(function(t) {
                return '<span class="tag">' + escapeHtml(t) + '</span>';
            }).join('');

            var bodyHtml = typeof marked !== 'undefined' ? marked.parse(post.content) : post.content;

            articleView.innerHTML =
                '<a href="writeups.html" class="back-link">&larr; All write-ups</a>' +
                '<header class="writeup-header">' +
                    '<h1>' + escapeHtml(post.meta.title || post.slug) + '</h1>' +
                    '<p class="writeup-meta">' +
                        '<span>' + escapeHtml(post.meta.category || 'Analysis') + '</span>' +
                        (post.meta.date ? ' · <time>' + escapeHtml(post.meta.date) + '</time>' : '') +
                    '</p>' +
                    (post.meta.summary ? '<p class="writeup-summary">' + escapeHtml(post.meta.summary) + '</p>' : '') +
                    (tagsHtml ? '<div class="tags">' + tagsHtml + '</div>' : '') +
                '</header>' +
                '<div class="writeup-body">' + bodyHtml + '</div>' +
                '<footer class="writeup-footer">' +
                    '<a href="writeups.html" class="back-link">&larr; All write-ups</a>' +
                '</footer>';

            articleView.querySelectorAll('.back-link').forEach(function(btn) {
                btn.addEventListener('click', function(e) {
                    e.preventDefault();
                    if (window.history.pushState) {
                        window.history.pushState('', document.title, window.location.pathname + window.location.search);
                        handleRoute();
                    } else {
                        window.location.hash = '';
                    }
                });
            });
        }

        function handleRoute() {
            var hash = window.location.hash.replace(/^#/, '');

            if (!hash) {
                document.body.classList.remove('view-article');
                articleView.innerHTML = '';
                return;
            }

            var post = postsCache[hash];
            if (post) {
                document.body.classList.add('view-article');
                renderArticle(post);
                window.scrollTo(0, 0);
            } else if (Object.keys(postsCache).length > 0) {
                document.body.classList.add('view-article');
                articleView.innerHTML =
                    '<a href="writeups.html" class="back-link">&larr; All write-ups</a>' +
                    '<div style="padding: 4rem 0;">' +
                        '<h1>Write-up Not Found</h1>' +
                        '<p style="margin-top: 1rem; color: var(--text-muted);">The write-up <code>#' + escapeHtml(hash) + '</code> was not found.</p>' +
                    '</div>';
                window.scrollTo(0, 0);
            }
        }

        window.addEventListener('hashchange', handleRoute);
        loadPosts();
    })();
    </script>
