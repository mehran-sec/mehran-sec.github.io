    <!-- =====================================================================
         AUTOMATIC MARKDOWN LOADER & RENDERER
         ===================================================================== -->
    <script>
    (function() {
        'use strict';

        var DEFAULT_MANIFEST = [
            'n8n-soc-alert-pipeline.md',
            'ssh-bruteforce-detection.md',
            'wazuh-detection-lab.md',
            'enterprise-soc-homelab.md',
            'pcap-phishing-investigation.md'
        ];

        var postsCache = {};
        var allPosts = [];
        var activeFilter = 'all';
        var cardGrid = document.getElementById('card-grid');
        var articleView = document.getElementById('article-view');

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>"']/g, function(m) {
                return {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#39;'
                }[m];
            });
        }

        function parseFrontmatter(rawText) {
            var match = rawText.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n([\s\S]*)$/);
            if (!match) {
                return { meta: {}, content: rawText };
            }
            var rawMeta = match[1];
            var content = match[2];
            var meta = {};
            rawMeta.split(/\r?\n/).forEach(function(line) {
                var colonIndex = line.indexOf(':');
                if (colonIndex !== -1) {
                    var key = line.slice(0, colonIndex).trim().toLowerCase();
                    var value = line.slice(colonIndex + 1).trim();
                    meta[key] = value;
                }
            });
            return { meta: meta, content: content };
        }

        function loadPosts() {
            var manifestUrl = 'writeups/manifest.json?v=' + Date.now();
            fetch(manifestUrl, { cache: 'no-store' })
                .then(function(res) {
                    if (res.ok) return res.json();
                    throw new Error('Manifest fetch failed');
                })
                .catch(function() {
                    return DEFAULT_MANIFEST;
                })
                .then(function(files) {
                    var fetchPromises = files.map(function(file) {
                        var slug = file.replace(/\.md$/, '');
                        return fetch('writeups/' + file + '?v=' + Date.now(), { cache: 'no-store' })
                            .then(function(res) {
                                if (res.ok) return res.text();
                                throw new Error('Failed to load ' + file);
                            })
                            .then(function(text) {
                                var parsed = parseFrontmatter(text);
                                return {
                                    file: file,
                                    slug: slug,
                                    meta: parsed.meta,
                                    content: parsed.content
                                };
                            })
                            .catch(function(err) {
                                console.warn('Could not load writeup:', file, err);
                                return null;
                            });
                    });

                    return Promise.all(fetchPromises);
                })
                .then(function(posts) {
                    allPosts = posts.filter(Boolean);
                    postsCache = {};
                    allPosts.forEach(function(post) {
                        postsCache[post.slug] = post;
                    });

                    renderCards();
                    setupFilters();
                    handleRoute();
                });
        }

        function postMatchesFilter(post, filter) {
            if (filter === 'all') return true;
            var category = (post.meta.category || '').toLowerCase();
            var tags = (post.meta.tags || '').toLowerCase();
            var title = (post.meta.title || '').toLowerCase();
            var fullText = category + ' ' + tags + ' ' + title;

            if (filter === 'linux') {
                return fullText.indexOf('linux') !== -1;
            }
            if (filter === 'detection') {
                return fullText.indexOf('detection') !== -1;
            }
            if (filter === 'network') {
                return fullText.indexOf('network') !== -1 || fullText.indexOf('pcap') !== -1 || fullText.indexOf('wireshark') !== -1;
            }
            if (filter === 'web') {
                return fullText.indexOf('web') !== -1 || fullText.indexOf('owasp') !== -1;
            }
            if (filter === 'soc') {
                return fullText.indexOf('soc') !== -1 || fullText.indexOf('wazuh') !== -1 || fullText.indexOf('soar') !== -1;
            }
            return false;
        }

        function renderCards() {
            cardGrid.innerHTML = '';
            var filtered = allPosts.filter(function(post) {
                return postMatchesFilter(post, activeFilter);
            });

            if (filtered.length === 0) {
                var emptyLi = document.createElement('li');
                emptyLi.className = 'no-writeups';
                emptyLi.textContent = 'No write-ups found in this category yet.';
                cardGrid.appendChild(emptyLi);
                return;
            }

            filtered.forEach(function(post) {
                var li = document.createElement('li');
                var category = post.meta.category || (post.meta.tags ? post.meta.tags.split(',')[0].trim() : 'Lab');

                li.innerHTML =
                    '<a class="writeup-card" href="#' + encodeURIComponent(post.slug) + '">' +
                        '<div class="writeup-card-icon" aria-hidden="true">' +
                            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
                                '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>' +
                                '<polyline points="14 2 14 8 20 8"/>' +
                                '<line x1="16" y1="13" x2="8" y2="13"/>' +
                                '<line x1="16" y1="17" x2="8" y2="17"/>' +
                            '</svg>' +
                        '</div>' +
                        '<div class="writeup-card-content">' +
                            '<h3 class="writeup-card-title">' + escapeHtml(post.meta.title || post.slug) + '</h3>' +
                            '<div class="writeup-card-meta">' +
                                '<time>' + escapeHtml(post.meta.date || '') + '</time>' +
                                '<span class="writeup-card-tag">' + escapeHtml(category) + '</span>' +
                            '</div>' +
                        '</div>' +
                    '</a>';

                cardGrid.appendChild(li);
            });
        }

        function setupFilters() {
            var filterBtns = document.querySelectorAll('#filter-bar .filter-btn');
            filterBtns.forEach(function(btn) {
                btn.addEventListener('click', function() {
                    filterBtns.forEach(function(b) {
                        b.classList.remove('active');
                        b.setAttribute('aria-selected', 'false');
                    });
                    btn.classList.add('active');
                    btn.setAttribute('aria-selected', 'true');
                    activeFilter = btn.getAttribute('data-filter') || 'all';
                    renderCards();
                });
            });
        }

        function renderArticle(post) {
            var tags = (post.meta.tags || '').split(',').map(function(t) { return t.trim(); }).filter(Boolean);
            var tagsHtml = tags.map(function(t) {
                return '<span class="tag">' + escapeHtml(t) + '</span>';
            }).join('');

            // Normalize any leading /assets/ paths so they resolve relative to writeups.html
            var normalizedContent = (post.content || '').replace(/\]\(\/assets\//g, '](assets/');
            var bodyHtml = typeof marked !== 'undefined' ? marked.parse(normalizedContent) : normalizedContent;
            bodyHtml = bodyHtml.replace(/src=["']\/assets\//g, 'src="assets/');

            articleView.innerHTML =
                '<a href="writeups.html" class="back-link">&larr; All write-ups</a>' +
                '<header class="writeup-header">' +
                    '<h1>' + escapeHtml(post.meta.title || post.slug) + '</h1>' +
                    '<p class="writeup-meta">' +
                        '<span>' + escapeHtml(post.meta.category || 'Analysis') + '</span>' +
                        (post.meta.date ? ' · <time>' + escapeHtml(post.meta.date) + '</time>' : '') +
                    '</p>' +
                    (post.meta.summary ? '<p class="writeup-summary">' + escapeHtml(post.meta.summary) + '</p>' : '') +
                    (tagsHtml ? '<div class="tags">' + tagsHtml + '</div>' : '') +
                '</header>' +
                '<div class="writeup-body">' + bodyHtml + '</div>' +
                '<footer class="writeup-footer">' +
                    '<a href="writeups.html" class="back-link">&larr; All write-ups</a>' +
                '</footer>';

            articleView.querySelectorAll('.back-link').forEach(function(btn) {
                btn.addEventListener('click', function(e) {
                    e.preventDefault();
                    if (window.history.pushState) {
                        window.history.pushState('', document.title, window.location.pathname + window.location.search);
                        handleRoute();
                    } else {
                        window.location.hash = '';
                    }
                });
            });
        }

        function handleRoute() {
            var hash = window.location.hash.replace(/^#/, '');

            if (!hash) {
                document.body.classList.remove('view-article');
                articleView.innerHTML = '';
                return;
            }

            var post = postsCache[hash];
            if (post) {
                document.body.classList.add('view-article');
                renderArticle(post);
                window.scrollTo(0, 0);
            } else if (Object.keys(postsCache).length > 0) {
                document.body.classList.add('view-article');
                articleView.innerHTML =
                    '<a href="writeups.html" class="back-link">&larr; All write-ups</a>' +
                    '<div style="padding: 4rem 0;">' +
                        '<h1>Write-up Not Found</h1>' +
                        '<p style="margin-top: 1rem; color: var(--text-muted);">The write-up <code>#' + escapeHtml(hash) + '</code> was not found.</p>' +
                    '</div>';
                window.scrollTo(0, 0);
            }
        }

        window.addEventListener('hashchange', handleRoute);
        loadPosts();
    })();
    </script>
    <!-- Mehran AI Portfolio Assistant Widget -->
    <script src="chatbot.js"></script>
</body>
